<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Surprising AI Facts: true, sourced, and weirder than you think">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="18%" stop-color="#0ea5e9"/>
      <stop offset="36%" stop-color="#10b981"/>
      <stop offset="54%" stop-color="#ef4444"/>
      <stop offset="72%" stop-color="#f59e0b"/>
      <stop offset="86%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <!-- soft glows -->
  <circle cx="120" cy="60" r="160" fill="#6366f1" opacity="0.18"/>
  <circle cx="1080" cy="280" r="180" fill="#ec4899" opacity="0.16"/>
  <circle cx="700" cy="-40" r="140" fill="#10b981" opacity="0.12"/>

  <!-- floating sparkles -->
  <g fill="#f59e0b" opacity="0.85">
    <path d="M150 210 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z"/>
    <path d="M1040 70 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z"/>
  </g>
  <g fill="#0ea5e9" opacity="0.7">
    <path d="M1080 170 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z"/>
    <path d="M90 110 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z"/>
  </g>

  <!-- big question mark watermark -->
  <text x="1010" y="250" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="220" font-weight="800" fill="#8b5cf6" opacity="0.10">?</text>

  <!-- rainbow rail -->
  <rect x="0" y="300" width="1200" height="20" fill="url(#rainbow)"/>

  <!-- eyebrow -->
  <text x="600" y="92" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#94a3b8">TRUE · SOURCED · WEIRDER THAN YOU THINK</text>

  <!-- title -->
  <text x="600" y="170" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#title)" filter="url(#glow)">Surprising AI Facts</text>

  <!-- subtitle -->
  <text x="600" y="214" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#e2e8f0">40 little-known facts · every one with a source</text>

  <!-- category pills -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">
    <rect x="227" y="246" width="96" height="30" rx="15" fill="#6366f1"/><text x="275" y="266">history</text>
    <rect x="333" y="246" width="96" height="30" rx="15" fill="#0ea5e9"/><text x="381" y="266">weird</text>
    <rect x="439" y="246" width="96" height="30" rx="15" fill="#10b981"/><text x="487" y="266">scale</text>
    <rect x="545" y="246" width="96" height="30" rx="15" fill="#ef4444"/><text x="593" y="266">failures</text>
    <rect x="651" y="246" width="96" height="30" rx="15" fill="#f59e0b"/><text x="699" y="266">language</text>
    <rect x="757" y="246" width="96" height="30" rx="15" fill="#8b5cf6"/><text x="805" y="266">energy</text>
    <rect x="863" y="246" width="96" height="30" rx="15" fill="#ec4899"/><text x="911" y="266">myths</text>
  </g>
</svg>
